/* ===== MODERN UI LAYER ===== */
:root{--gold:#f0c35e;--gold2:#c8922f;--cream:#f4f2ec;--r:22px;--sh:0 10px 40px -12px rgba(11,20,36,.18)}
body{font-family:'Tajawal',Tahoma,Arial,sans-serif;font-size:16px;background:var(--cream);-webkit-font-smoothing:antialiased}
.top{background:linear-gradient(90deg,#070e19,#14243b);font-size:12.5px;letter-spacing:.2px}
.nav{background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);box-shadow:0 1px 0 #0b142410}
.brand{font-size:19px;font-weight:900}.brand img{border:2px solid var(--gold);box-shadow:0 0 0 4px #f0c35e33}
.navlinks a{position:relative;font-weight:700;padding:6px 2px}.navlinks a:after{content:"";position:absolute;inset:auto 0 -2px;height:2px;background:var(--gold2);transform:scaleX(0);transition:.25s}.navlinks a:hover:after{transform:scaleX(1)}
.btn{border-radius:999px;padding:12px 24px;font-weight:800;transition:.25s}
.btn.primary{background:linear-gradient(135deg,#ffd978,#e0a73a);color:#1b1304;box-shadow:0 10px 24px -8px #e0a73aaa}
.btn.wa{background:linear-gradient(135deg,#1fb77a,#0f8f5f);box-shadow:0 10px 24px -10px #159765}
.btn:hover{transform:translateY(-3px);filter:brightness(1.05)}
.hero{position:relative;padding:72px 0 80px;background:radial-gradient(60% 80% at 90% 0%,#e8b95733,transparent 60%),radial-gradient(50% 60% at 0% 100%,#3b6aa633,transparent 60%),linear-gradient(135deg,#060d1a,#12233b 60%,#1a3354)}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff14 1px,transparent 1px);background-size:26px 26px;mask-image:linear-gradient(#000,transparent 85%);-webkit-mask-image:linear-gradient(#000,transparent 85%)}
.hero .wrap{position:relative}
.eyebrow{display:inline-block;background:#f0c35e1f;border:1px solid #f0c35e55;color:var(--gold);padding:6px 16px;border-radius:999px;font-size:13.5px}
.hero h1{font-weight:900;font-size:clamp(36px,6vw,62px);line-height:1.15;margin:18px 0 14px;background:linear-gradient(120deg,#fff 30%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:17.5px;color:#cdd7e5;margin-bottom:26px}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.badges span{background:#ffffff12;border:1px solid #ffffff1f;backdrop-filter:blur(8px);padding:7px 14px;border-radius:999px;font-size:13px;color:#e6ecf5}
.hero-logo{position:relative;border-radius:32px;padding:14px;background:linear-gradient(160deg,#ffffff1f,#ffffff06);border:1px solid #f0c35e55;box-shadow:0 30px 70px -20px #000a,0 0 80px -10px #f0c35e44;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
.section{padding:72px 0}.section-head{margin-bottom:34px}
.section-head h2{font-size:clamp(26px,4vw,36px);font-weight:900;position:relative;display:inline-block;padding-bottom:14px}
.section-head h2:after{content:"";position:absolute;bottom:0;left:50%;width:56px;height:4px;margin-left:-28px;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.home-services{gap:20px}
.service-card{position:relative;overflow:hidden;border:1px solid #e9ecf2;border-radius:var(--r);padding:30px 18px;box-shadow:var(--sh);transition:.3s cubic-bezier(.2,.8,.2,1);font-family:inherit}
.service-card:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold2));transform:scaleX(0);transform-origin:right;transition:.35s}
.service-card:hover{transform:translateY(-8px);box-shadow:0 24px 50px -16px rgba(11,20,36,.3);border-color:#f0c35e88}.service-card:hover:before{transform:scaleX(1)}
.ico{width:68px;height:68px;border-radius:20px;font-size:32px;background:linear-gradient(145deg,#fff4d6,#f6dca0);box-shadow:inset 0 -3px 8px #c8922f26,0 8px 18px -8px #c8922f88;transition:.3s}.service-card:hover .ico{transform:scale(1.1) rotate(-6deg)}
.service-card h3{font-size:19px;font-weight:800}.service-card p{font-size:13.5px}
.service-heading{border-radius:var(--r);padding:30px;background:radial-gradient(70% 120% at 100% 0%,#f0c35e30,transparent 60%),linear-gradient(120deg,#0b1424,#1b3050);box-shadow:var(--sh)}
.service-heading h2{font-weight:900}
.back{border-radius:999px;font-weight:700;transition:.2s}.back:hover{background:var(--navy);color:#fff}
.choice{border-radius:16px;padding:15px;border:1.5px solid #e6e9f0;transition:.2s;font-weight:700}.choice:hover{border-color:var(--gold);transform:translateY(-2px)}
.choice:has(input:checked){background:linear-gradient(135deg,#fffaf0,#fff1cf);border-color:var(--gold2);box-shadow:0 8px 20px -10px #c8922f}
.request-box,.panel,.review,.admin-panel{border-radius:var(--r);border:1px solid #e9ecf2;box-shadow:var(--sh)}
.field input,.field textarea,.field select,.review-form input,.review-form textarea{border:1.5px solid #e1e5ee;border-radius:14px;padding:13px 14px;background:#fbfcfe;transition:.2s}
.field input:focus,.field textarea:focus,.field select:focus,.review-form input:focus,.review-form textarea:focus{border-color:var(--gold2);background:#fff;box-shadow:0 0 0 4px #f0c35e33}
.safe-note,.admin-note{border-radius:14px;border:1px solid #f3e1b0}
.product-card,.offer-card,.custom-service{border-radius:var(--r);border:1px solid #e9ecf2;box-shadow:var(--sh);transition:.3s}.product-card:hover,.offer-card:hover{transform:translateY(-6px)}
.offer-card{background:linear-gradient(160deg,#fff,#fff8e6);border-color:#f0c35e66}
.price{font-size:20px;color:var(--gold2)}
.stars{font-size:18px}
.contact{background:radial-gradient(60% 100% at 0% 0%,#f0c35e22,transparent 60%),linear-gradient(135deg,#0b1424,#16294a);padding:56px 0}
.contact h2{font-size:30px;font-weight:900}
.footer{background:#060c17}
.float{width:60px;height:60px;background:linear-gradient(135deg,#25d98f,#0f8f5f);animation:pl 2.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #25d98f88}70%{box-shadow:0 0 0 18px #25d98f00}100%{box-shadow:0 0 0 0 #25d98f00}}
@media(max-width:850px){.section{padding:52px 0}.hero{padding:52px 0 56px}.hero-grid{text-align:center}.hero p{margin-inline:auto}.badges{justify-content:center}.home-services{gap:12px}.service-card{padding:22px 12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== END ===== */

/* ===== THEME 3: NEON AURORA (dark, bento) ===== */
body{background:#050a14;color:#e8edf8}
body:before{content:"";position:fixed;inset:-20%;z-index:-2;background:radial-gradient(40% 40% at 20% 20%,#4f8cff44,transparent 70%),radial-gradient(35% 35% at 80% 30%,#a770ff3c,transparent 70%),radial-gradient(40% 40% at 60% 85%,#f0c35e30,transparent 70%),radial-gradient(30% 30% at 10% 80%,#ff5fa232,transparent 70%);filter:blur(30px);animation:aur 18s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate3d(6%,4%,0) rotate(8deg) scale(1.15)}}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent)}
#root{color-scheme:dark}
#root .top{background:transparent;border-bottom:1px solid #ffffff12;color:#9fb0c9}
#root .nav{background:#0a1224b8;border:1px solid #ffffff22;border-radius:999px;margin:14px auto 0;width:min(1160px,94%);top:calc(14px + env(safe-area-inset-top,0px));box-shadow:0 20px 50px -20px #000}
#root .navin{padding:8px 18px;width:100%}
#root .brand{color:#fff}#root .brand small{color:var(--gold)}#root .navlinks{color:#c6d1e4}#root .navlinks a:hover{color:var(--gold)}
#root .menu-btn{background:#ffffff14;border-color:#ffffff26;color:#fff}
#root .mobile-menu{background:transparent;border-top:1px solid #ffffff1a}#root .mobile-menu a{background:#ffffff0d}
#root .hero{background:none;padding:84px 0 40px}#root .hero:before,#root .hero:after{display:none}
#root .hero-grid{grid-template-columns:1.1fr .7fr}
#root .hero h1{font-size:clamp(44px,8vw,96px);line-height:1.05;background:linear-gradient(90deg,#fff,#f0c35e,#ff5fa2,#4f8cff,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:-300% 0}}
#root .hero p{color:#b9c6dc}
#root .hero-logo{position:relative;overflow:hidden;isolation:isolate;padding:4px;background:none;border:0;border-radius:34px;box-shadow:0 0 90px -10px #a770ff66}
#root .hero-logo:before{content:"";position:absolute;inset:-50%;z-index:-1;filter:none;opacity:1;border-radius:0;background:conic-gradient(from 0deg,transparent 0 55%,#f0c35e,#ff5fa2,#4f8cff,transparent);animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#root .hero-logo img{position:relative;border-radius:30px;background:#080f1c}
.marquee{margin-top:64px;border-block:1px solid #ffffff1a;background:#ffffff06;overflow:hidden;direction:ltr;transform:rotate(-1.2deg);width:104%;margin-inline:-2%}
.marquee .track{display:flex;align-items:center;gap:28px;width:max-content;padding:14px 0;animation:mq 38s linear infinite}
.marquee span{font-size:34px;font-weight:900;color:transparent;-webkit-text-stroke:1px #ffffff66;white-space:nowrap}
.marquee i{color:var(--gold);font-style:normal;font-size:22px}
@keyframes mq{to{transform:translateX(-50%)}}
#root .section-head h2{color:#fff}#root .section-head p{color:#9fb0c9}
#root .home-services{grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(210px,auto);gap:16px;counter-reset:s}
#root .home-services .service-card:nth-child(1),#root .home-services .service-card:nth-child(6){grid-column:span 2}
#root .service-card:nth-child(1){--c:#4f8cff}#root .service-card:nth-child(2){--c:#a770ff}#root .service-card:nth-child(3){--c:#ff5fa2}#root .service-card:nth-child(4){--c:#ffa24d}#root .service-card:nth-child(5){--c:#ff5252}#root .service-card:nth-child(n+6){--c:#f0c35e}
#root .service-card{--c:#f0c35e;counter-increment:s;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;text-align:right;padding:26px;border:1px solid #ffffff1f;outline:0;border-radius:28px;backdrop-filter:blur(14px);background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--c) 30%,transparent),transparent 62%),linear-gradient(160deg,#ffffff14,#ffffff05);box-shadow:0 20px 50px -24px #000}
#root .service-card:before{content:"0" counter(s);position:absolute;inset:18px auto auto 22px;height:auto;width:auto;background:none;transform:none;font-size:48px;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:1px #ffffff30}
#root .service-card:after{bottom:20px;left:22px;color:var(--c)}
#root .service-card:hover{transform:translateY(-10px) scale(1.01);border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 30px 80px -24px var(--c)}
#root .service-card .ico{margin:0 0 auto;width:64px;height:64px;border-radius:20px;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 50%,#000));box-shadow:0 0 34px -4px var(--c)}
#root .service-card h3{color:#fff;font-size:21px;margin-top:22px}#root .service-card p{color:#aebbd1}
#root .home-services .service-card:nth-child(1) h3,#root .home-services .service-card:nth-child(6) h3{font-size:28px}
#root .service-heading{border:1px solid #ffffff22}
#root .request-box,#root .panel,#root .review,#root .product-card,#root .offer-card,#root .admin-panel{background:linear-gradient(160deg,#ffffff13,#ffffff06);border:1px solid #ffffff1c;backdrop-filter:blur(14px);color:#e8edf8;box-shadow:0 20px 50px -26px #000}

#root .field input,#root .field textarea,#root .field select,#root .review-form input,#root .review-form textarea,#root .review-form select{background:#ffffff0d;border:1.5px solid #ffffff24;color:#fff}
#root input::placeholder,#root textarea::placeholder{color:#7f8da6}
#root .field input:focus,#root .field textarea:focus,#root .field select:focus,#root .review-form input:focus,#root .review-form textarea:focus{background:#ffffff14;border-color:var(--gold);box-shadow:0 0 0 4px #f0c35e2e}
#root option{color:#111;background:#fff}
#root .choice{background:#ffffff0a;border:1.5px solid #ffffff1d;color:#e8edf8}

function inDb(p){return !!(DBS&&p.id&&DBS[p.id]!==undefined&&DBS[p.id]!==null)}
function stockOf(x){
 if(inDb(x))return Math.max(0,Number(DBS[x.id]));
 if(x.qty===undefined||x.qty===null||x.qty===''||isNaN(Number(x.qty)))return null;
 return Math.max(0,Number(x.qty)-(soldMap()[x.name]||0));
}

}

}
async function dbDec(id){

async function buyNames(names){

 names.forEach(n=>{const p=D.products.find(x=>x.name===n);if(!p||stockOf(p)===0)return;if(inDb(p))dbIds.push(p.id);else local.push(n)});
 if(dbIds.length){await Promise.all(dbIds.map(dbDec));await dbLoad()}

 const brandOf=model=>{const v=String(model).trim().toLowerCase();const hit=brandAliases.find(([name,aliases])=>aliases.some(a=>v.startsWith(a)));return hit?hit[0]:(String(model).trim().split(/\s+/)[0]||'أجهزة أخرى');};
 const deviceMatch=(item,device)=>{const tokens=deviceTokens(item);if(tokens.some(isAllDevice))return true;if(!device)return false;if(device.startsWith('brand:')){const brand=device.slice(6).toLowerCase();return tokens.some(v=>brandOf(v).toLowerCase()===brand);}return tokens.some(v=>v.toLowerCase()===device.toLowerCase()||v.toLowerCase().includes(device.toLowerCase())||device.toLowerCase().includes(v.toLowerCase()));};

/* ---- كلمة المرور (تُخزَّن كـ hash فقط، مش نص صريح) ---- */
const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhx=s=>new Uint8Array((s.match(/../g)||[]).map(h=>parseInt(h,16)));
function slowHash(p,salt){let a=0xdeadbeef,b=0x41c6ce57;const s=salt+p;for(let r=0;r<30000;r++){for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909)}return (a>>>0).toString(16).padStart(8,'0')+(b>>>0).toString(16).padStart(8,'0')}
async function hashWith(kind,p,salt){
 if(kind==='p1'){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return hx(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unhx(salt),iterations:150000},k,256))}
 return slowHash(p,salt);
}
async function hashPass(p){
 const kind=(window.crypto&&crypto.subtle)?'p1':'f1',sb=new Uint8Array(16);
 if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(sb);else sb.forEach((_,i)=>{sb[i]=Math.floor(Math.random()*256)});
 const salt=hx(sb);return kind+'$'+salt+'$'+await hashWith(kind,p,salt);
}
async function verifyPass(p,stored){const [kind,salt,h]=String(stored).split('$');try{return (await hashWith(kind,p,salt))===h}catch(e){return false}}
function pwDialog({title,sub,again}){return new Promise(res=>{
 const o=document.createElement('div');o.className='pwov';
 o.innerHTML=`<form class="pwbox" autocomplete="off"><h3>${title}</h3><p>${sub||''}</p><input type="password" id="pw1" placeholder="كلمة المرور" autocomplete="new-password" required>${again?'<input type="password" id="pw2" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password" required>':''}<div class="pwerr" id="pwerr"></div><div class="pwbtns"><button class="btn primary" type="submit">تأكيد</button><button class="back" type="button" id="pwx">إلغاء</button></div></form>`;
 document.body.appendChild(o);
 const f=o.firstChild,i1=o.querySelector('#pw1'),err=m=>{o.querySelector('#pwerr').textContent=m},close=v=>{o.remove();res(v)};
 setTimeout(()=>i1.focus(),30);
 o.querySelector('#pwx').onclick=()=>close(null);
 f.onsubmit=e=>{e.preventDefault();const p=i1.value;if(again){if(p.length<8){err('كلمة المرور لازم تكون 8 أحرف على الأقل');return}if(p!==o.querySelector('#pw2').value){err('الكلمتين مش متطابقتين');return}}close(p)};
})}
async function adminLogin(){
 const lock=+lsGet(LS_LOCK)||0;
 if(Date.now()<lock){alert('محاولات غلط كتير. استنى '+Math.ceil((lock-Date.now())/1000)+' ثانية وحاول تاني.');return false}
 const stored=D.adminHash||lsGet(LS_HASH);
 if(!stored){
  const p=await pwDialog({title:'🔐 إنشاء كلمة مرور للوحة الإدارة',sub:'أول مرة: اختار كلمة مرور قوية (8 أحرف على الأقل). هتحتاجها كل مرة تفتح اللوحة.',again:true});
  if(!p)return false;
  const h=await hashPass(p);D.adminHash=h;lsSet(LS_HASH,h);save(false);return true;
 }
 for(let n=0;n<5;n++){
  const p=await pwDialog({title:'🔐 لوحة إدارة عمار ستور',sub:n?`كلمة المرور غلط (محاولة ${n} من 5)`:'اكتب كلمة المرور'});
  if(p==null)return false;
  if(await verifyPass(p,stored)){lsSet(LS_LOCK,'0');return true}
 }
 lsSet(LS_LOCK,String(Date.now()+60000));alert('تم إيقاف المحاولات دقيقة واحدة.');return false;
}

}

/* ---- قاعدة البيانات: صلاحيات المالك ---- */
async function dbAuth(force){
 if(OTOK&&!force)return OTOK;
 const k=D.db&&D.db.apiKey,em=lsGet('ammar_db_email');
 if(!k||!em||!DBPW)throw new Error('noauth');
 const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:DBPW,returnSecureToken:true})});
 if(!r.ok)throw new Error('badauth');
 OTOK=(await r.json()).idToken;return OTOK;
}
async function dbWrite(id,val){
 const u=dbUrl();if(!u||!id)return false;
 for(let t=0;t<2;t++){
  let tok;try{tok=await dbAuth(t>0)}catch(e){setStatus('⚠️ سجّل دخول القاعدة من الإعدادات علشان المخزون يتحدّث');return false}
  try{
   const r=await fetch(u+'/stock/'+encodeURIComponent(id)+'.json?auth='+encodeURIComponent(tok),{method:val===null?'DELETE':'PUT',body:val===null?undefined:JSON.stringify(val)});
   if(r.ok){DBS=DBS||{};if(val===null)delete DBS[id];else DBS[id]=val;DBSIG=JSON.stringify(DBS);return true}
   if(r.status!==401&&r.status!==403)break;
  }catch(e){break}
 }
 setStatus('⚠️ تعذر تحديث المخزون في قاعدة البيانات');return false;
}
/* ---- مزامنة محتوى الموقع (منتجات/عروض/خدمات/إعدادات) مع قاعدة البيانات ---- */
var cwTimer=null;
function contentPayload(){return {services:D.services,products:D.products,offers:D.offers,cfg:D.cfg,updatedAt:D.updatedAt}}
async function contentWrite(){
 const u=dbUrl();if(!u)return false;
 for(let t=0;t<2;t++){
  let tok;try{tok=await dbAuth(t>0)}catch(e){setStatus('⚠️ سجّل دخول القاعدة من الإعدادات علشان التعديل يظهر للعملاء');return false}
  try{
   const r=await fetch(u+'/content.json?auth='+encodeURIComponent(tok),{method:'PUT',body:JSON.stringify(contentPayload())});
   if(r.ok){setStatus('✅ اتنشر للعملاء فورًا');return true}
   if(r.status!==401&&r.status!==403)break;
  }catch(e){break}
 }
 setStatus('⚠️ تعذر نشر التعديل لقاعدة البيانات');return false;
}
async function contentLoad(){
 const u=dbUrl();if(!u)return;
 try{
  const r0=await fetch(u+'/content/updatedAt.json',{cache:'no-store'});if(!r0.ok)return;
  const t=await r0.json();
  if(!t||t===D.updatedAt||(D.updatedAt&&t<D.updatedAt))return;
  const r=await fetch(u+'/content.json',{cache:'no-store'});if(!r.ok)return;
  const c=await r.json();if(!c||typeof c!=='object')return;
  for(const k of ['services','products','offers'])D[k]=Array.isArray(c[k])?c[k]:(c[k]&&typeof c[k]==='object'?Object.values(c[k]):[]);
  D.cfg=c.cfg||{};D.updatedAt=c.updatedAt;
  lsSet(LS_DATA,JSON.stringify(D));
  render();refreshProducts();if(PANEL_OPEN)panel();
 }catch(e){}
}
/* ---- الحفظ والنشر ---- */
function setStatus(s){STATUS=s;const e=$('admStatus');if(e)e.textContent=s}
async function publish(){
 if(typeof claude==='undefined'||!claude||!claude.use){setStatus('💾 اتحفظ على جهازك — نزّل النسخة المحدثة من الإعدادات وارفعها للموقع');return}
 try{setStatus('⏳ جاري النشر للعملاء...');const art=await claude.use('artifact');if(!art)throw {code:'none'};await art.publish(build());setStatus('✅ اتنشر للعملاء')}
 catch(e){setStatus(e&&e.code==='not_writer'?'⚠️ النشر متاح لصاحب الحساب فقط':'💾 اتحفظ على جهازك — النشر للعملاء ما تمّش، نزّل النسخة المحدثة')}
}
function persist(){
 ensureIds();D.updatedAt=new Date().toISOString();
 const ok=lsSet(LS_DATA,JSON.stringify(D));
 setStatus(ok?'💾 اتحفظ على الجهاز':'⚠️ مساحة التخزين مليانة — نزّل نسخة محدثة');
 clearTimeout(pubTimer);clearTimeout(cwTimer);if(dbUrl()){cwTimer=setTimeout(contentWrite,800)}else{pubTimer=setTimeout(publish,1200)}
}

function downloadUpdated(){
 try{const b=new Blob([build()],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='AMMAR-STORE-UPDATED.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
 catch(e){alert('تعذر تنزيل النسخة')}
}
function shrink(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const s=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);const x2=c.getContext('2d');x2.fillStyle='#fff';x2.fillRect(0,0,c.width,c.height);x2.drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(f)})}

if(type==='repair'){msg+='الخدمة: صيانة الموبايلات\nالمشكلات: '+selected('fault')+'\nموديل الجهاز: '+val('repairModel')+'\nالاسم: '+val('repairName')+'\nوصف المشكلة: '+val('repairNotes')}
send(msg)}
function showView(id){if(window.showStorePage){window.showStorePage(id);return;}document.getElementById('servicesHome').classList.add('hidden');document.querySelectorAll('.service-view').forEach(v=>v.classList.toggle('active',v.id==='view-'+id));document.getElementById('services').scrollIntoView({behavior:'smooth'});}
function showHome(){document.querySelectorAll('.service-view').forEach(v=>v.classList.remove('active'));document.getElementById('servicesHome').classList.remove('hidden');if(window.showStorePage)window.showStorePage('home');else document.getElementById('services').scrollIntoView({behavior:'smooth'});}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',showHome));
document.getElementById('reviewForm').addEventListener('submit',e=>{e.preventDefault();const name=val('reviewName')==='—'?'عميل عمار ستور':val('reviewName');const stars='★'.repeat(Number(val('reviewStars')));const text=val('reviewText');send(`مرحبًا عمار ستور، حابب أرسل تقييمي للمحل:\nالاسم: ${name}\nالتقييم: ${stars}\nالرأي: ${text}\nبرجاء مراجعته قبل النشر.`)});
document.getElementById('brandHome').addEventListener('click',()=>showHome());document.querySelectorAll('[data-home]').forEach(a=>a.addEventListener('click',()=>showHome()));const menuBtn=document.getElementById('menuBtn'),mobileMenu=document.getElementById('mobileMenu');menuBtn.addEventListener('click',()=>{const open=mobileMenu.classList.toggle('open');menuBtn.setAttribute('aria-expanded',open?'true':'false')});mobileMenu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{mobileMenu.classList.remove('open');menuBtn.setAttribute('aria-expanded','false')}));document.getElementById('year').textContent=new Date().getFullYear();
const ownerBtn=document.getElementById('ownerAddProduct');if(ownerBtn)ownerBtn.addEventListener('click',()=>{if(!ADMIN_OK)return;PANEL_OPEN=true;TAB='products';panel()});
(function(){const v=document.getElementById('view-guide');if(!v)return;
const cos=[...v.querySelectorAll('.guide-co')],sf=v.querySelector('.guide-search'),head=v.querySelector('.service-heading'),gq=document.getElementById('guideSearch');
const pick=document.createElement('div');pick.id='guidePick';
pick.innerHTML='<h3>اختار الشبكة أو الخدمة</h3><div class="choice-grid">'+cos.map((c,i)=>`<button type="button" class="choice" data-g="${i}">${c.querySelector('h3').textContent}</button>`).join('')+'</div>';
const bar=document.createElement('div');bar.className='backrow';bar.innerHTML='<button class="back" type="button" id="guideBack">← اختيار شبكة تانية</button>';
head.after(pick);pick.after(bar);
function showG(i){pick.style.display=i<0?'':'none';bar.style.display=i<0?'none':'';sf.style.display=i<0?'none':'';
 if(gq)gq.value='';v.querySelectorAll('.guide-row,.guide-co').forEach(x=>x.hidden=false);
 cos.forEach((c,j)=>{c.style.display=j===i?'':'none'});window.scrollTo({top:0,behavior:'smooth'})}
pick.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>showG(+b.dataset.g)));
document.getElementById('guideBack').addEventListener('click',()=>showG(-1));
showG(-1);
})();
const gs=document.getElementById('guideSearch');if(gs)gs.addEventListener('input',()=>{const q=gs.value.trim().toLowerCase();document.querySelectorAll('#view-guide .guide-row').forEach(r=>{r.hidden=!!q&&!r.textContent.toLowerCase().includes(q)});document.querySelectorAll('#view-guide .guide-co').forEach(c=>{c.hidden=![...c.querySelectorAll('.guide-row')].some(r=>!r.hidden)})});
(function(){const b=document.getElementById('secretBtn');let n=0,t=0;if(b)b.addEventListener('click',()=>{const now=Date.now();if(now-t>3000)n=0;t=now;if(++n>=5){n=0;openAdmin()}});document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.altKey&&String(e.key).toLowerCase()==='a'){e.preventDefault();openAdmin()}})})();
</script></body></html>
